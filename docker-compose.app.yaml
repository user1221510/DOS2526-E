services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8050:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=ProductsDB;User Id=sa;Password=GrupoE2526!;TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server
    ports:
      - "1433:1433"
    environment:
      - SA_PASSWORD=GrupoE2526!
      - ACCEPT_EULA=Y
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'GrupoE2526!' -C -Q 'SELECT 1' || exit 1"]
      interval: 2s      # <--- Verifica a cada 2 segundos
      retries: 30       # <--- Tenta mais vezes já que o intervalo é curto
      start_period: 5s  # <--- Começa a testar logo aos 5 segundos
      timeout: 5s